# ================================================================
#   Jyoti Bank Management System — Application Configuration
#   IMPORTANT: Never commit real credentials to source control.
#   In production, use environment variables or a secrets manager.
# ================================================================

# ── Database Connection ──────────────────────────────────────────
# useSSL=false        : disable SSL for local dev (enable for production)
# serverTimezone      : required by MySQL Connector/J 8+ to avoid ambiguity
# allowPublicKeyRetrieval=true : required when useSSL=false with caching_sha2_password
db.url=jdbc:mysql://localhost:3306/jyoti_bank?useSSL=false&serverTimezone=Asia/Kathmandu&allowPublicKeyRetrieval=true
db.username=root
db.password=your_password_here

# ── HikariCP Connection Pool ────────────────────────────────────
# Maximum connections kept open simultaneously
db.pool.size=10
# Minimum idle connections maintained in the pool
db.pool.min.idle=2
# How long (ms) to wait for a connection before throwing an exception
db.pool.connection.timeout=30000
# How long (ms) a connection can sit idle before being removed
db.pool.idle.timeout=600000
# Maximum lifetime (ms) of a connection in the pool
db.pool.max.lifetime=1800000

# ── Application Identity ────────────────────────────────────────
app.name=Jyoti Bank Management System
app.version=1.0.0
app.currency=NPR
app.bank.code=JYOTI

# ── Security ────────────────────────────────────────────────────
# BCrypt cost factor: 12 = ~300ms per hash — slow enough to deter brute force
# Each increment doubles the work. Never go below 10 in production.
app.bcrypt.rounds=12
app.session.timeout.minutes=30
app.max.login.attempts=3

# ── Interest Rates (annual) ─────────────────────────────────────
# Stored as decimal fractions: 0.0450 = 4.50% per annum
interest.savings.annual=0.0450
interest.current.annual=0.0200

# ── Fixed Deposit ────────────────────────────────────────────────
fd.min.amount=1000.00
# Penalty applied on principal for early FD withdrawal
fd.early.withdrawal.penalty.rate=0.0200

# ── Minimum Balances ────────────────────────────────────────────
account.savings.min.balance=500.00
account.current.min.balance=1000.00

# ── Transaction Limits ──────────────────────────────────────────
transaction.max.single.transfer=500000.00
transaction.daily.withdrawal.limit=100000.00
